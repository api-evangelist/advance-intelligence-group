aid: advance-intelligence-group
name: Advance Intelligence Group
description: >-
  Advance Intelligence Group is an AI-driven technology company headquartered in
  Singapore, founded in 2016 and backed by SoftBank Vision Fund, Warburg Pincus
  and others. It operates three core business lines: ADVANCE.AI (Southeast Asia's
  leading provider of digital identity verification, KYC/KYB, AML, compliance and
  risk-management solutions, serving 500+ enterprise clients), Atome Financial
  (buy-now-pay-later and digital lending) and Ginee (e-commerce enablement). The
  ADVANCE.AI business unit exposes a public Open API for eKYC — token
  authentication, global document verification, OCR field extraction, face
  comparison and liveness detection — used across banking, fintech, payments,
  retail and e-commerce in emerging markets. This API Evangelist profile was
  enriched from the public developer documentation at doc.advance.ai.
